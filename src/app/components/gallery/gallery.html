<section id="galeria" class="section-space bg-mc-kraft/50"><div class="mx-auto max-w-7xl px-5 lg:px-8"><div class="section-heading"><div><p class="eyebrow">Behind the counter / 04</p><h2>Así se vive<br><span>MC Carne</span></h2></div><a class="btn-outline" href="https://www.instagram.com/mc_carne/" target="_blank" rel="noopener"><svg lucideCamera [size]="20"></svg> Seguinos en Instagram</a></div>
  <div class="gallery-grid mt-12">@for (image of images; track image.src; let i = $index) {<button type="button" class="gallery-item group" [class.gallery-tall]="image.vertical" (click)="open(i)" [attr.aria-label]="'Ampliar ' + image.alt"><img [src]="image.src" (error)="onImageError($event, i, image.vertical)" width="900" [height]="image.vertical ? 1000 : 700" [alt]="image.alt" loading="lazy" class="h-full w-full transition-transform duration-500 group-hover:scale-105" [class.object-contain]="image.src.includes('/logos/')" [class.object-cover]="!image.src.includes('/logos/')"><span class="absolute inset-0 grid place-items-center bg-mc-red/0 text-white opacity-0 transition-all duration-300 group-hover:bg-mc-red/35 group-hover:opacity-100"><svg lucideZoomIn [size]="34"></svg></span></button>}</div>
</div></section>
@if (selectedImage() !== null) {<div class="fixed inset-0 z-[70] grid place-items-center bg-mc-black/95 p-4" role="dialog" aria-modal="true" aria-label="Imagen ampliada" (click)="close()"><button type="button" class="absolute right-5 top-5 grid size-12 place-items-center border border-white/30 text-white" (click)="close()" aria-label="Cerrar"><svg lucideX></svg></button><img [src]="images[selectedImage()!].src" (error)="onImageError($event, selectedImage()!, images[selectedImage()!].vertical)" width="1200" height="900" [alt]="images[selectedImage()!].alt" class="max-h-[85vh] max-w-[92vw] object-contain" (click)="$event.stopPropagation()"></div>}
